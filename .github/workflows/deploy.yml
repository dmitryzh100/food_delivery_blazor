name: Deploy to GitHub Pages

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish (Release)
        run: dotnet publish FoodDeliveryBlazorApp/FoodDeliveryBlazorApp.csproj -c Release -o publish -p:BaseHref=/food_delivery_blazor/

      - name: Reconcile service worker integrity hashes
        shell: pwsh
        run: ./tools/fix-service-worker-integrity.ps1 -WwwRoot publish/wwwroot

      - name: Add SPA 404 fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
