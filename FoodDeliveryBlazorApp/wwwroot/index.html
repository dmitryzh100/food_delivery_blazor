<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FoodHub</title>
    <base href="/" />
    <meta name="theme-color" content="#FE724C" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FoodDeliveryBlazorApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="splash" role="status" aria-live="polite" aria-label="Loading FoodHub">
            <img class="splash-logo" src="images/splash_logo.svg" alt="" />
            <img class="splash-title" src="images/splash_logo_app_name.svg" alt="" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.blazorCulture = {
            get: () => window.localStorage['BlazorCulture'],
            set: (value) => window.localStorage['BlazorCulture'] = value
        };
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            const supported = ['en', 'uk', 'fr'];
            let culture = window.blazorCulture.get();

            if (!supported.includes(culture)) {
                culture = 'en';
            }

            Blazor.start({ applicationCulture: culture });
        })();
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/connectivity.js"></script>
    <script src="js/diagnostics.js"></script>
    <script src="js/slider.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
